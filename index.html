<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>UP Iron Atlas Beta</title>

  <!-- Ionic Framework -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"/>

  <!-- ViewerJS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.10.0/viewer.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.10.0/viewer.js"></script>

  <!-- OpenSeadragon -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>

  <!-- ArcGIS -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.23/esri/themes/dark/main.css" />
  <script src="https://js.arcgis.com/4.23/"></script>

  <!-- Portfolio typefaces -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ===== EXACT PORTFOLIO DESIGN TOKENS (from style.css) ===== */
    :root {
      --paper:       #f4ecd8;
      --paper-deep:  #ece1c8;
      --ink:         #3d3528;
      --ink-soft:    #6b6150;
      --surveyor:    #1a2f23;
      --forest:      #2d4a3e;
      --sage:        #8a9b8e;
      --route:       #c75d3a;
      --route-deep:  #a8472a;

      --font-display: "Source Serif 4", Georgia, serif;
      --font-body:    "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono:    "JetBrains Mono", "SF Mono", Consolas, monospace;

      --radius: 3px;
    }

    /* ===== BASE ===== */
    html, body, ion-app, ion-content, ion-split-pane, ion-menu, #viewDiv {
      height: 100%; width: 100%; margin: 0; padding: 0;
    }
    body { font-family: var(--font-body); background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.55; }
    #viewDiv { height: 100%; width: 100%;}
    #image { display: none; }
    .esri-popup__content img { cursor: pointer; }

    /* ===== IONIC GLOBAL OVERRIDES ===== */
    ion-app {
      --ion-background-color: var(--paper);
      --ion-text-color: var(--ink);
      --ion-font-family: var(--font-body);
    }

    /* ===== MAIN TOOLBAR — aged paper, matching portfolio header ===== */
    ion-toolbar {
      --background: rgba(244,236,216,0.96);
      --color: var(--surveyor);
      --border-color: rgba(61,53,40,0.18);
      border-bottom: 1px solid rgba(61,53,40,0.18);
    }
    ion-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 19px;
      letter-spacing: 0.01em;
      color: var(--surveyor);
    }

    /* ===== SIDEBAR / LEFT MENU ===== */
    ion-menu {
      --background: var(--paper-deep);
      --ion-background-color: var(--paper-deep);
    }
    ion-menu ion-toolbar {
      --background: var(--paper-deep);
      --color: var(--surveyor);
      border-bottom: 1px solid rgba(61,53,40,0.18);
    }
    ion-menu ion-title {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    #filters { padding: 8px; }

    /* ===== SEARCHBAR ===== */
    ion-searchbar {
      --background: var(--paper);
      --color: var(--ink);
      --placeholder-color: var(--ink-soft);
      --icon-color: var(--ink-soft);
      --border-radius: var(--radius);
      --box-shadow: inset 0 1px 3px rgba(61,53,40,0.12);
      font-family: var(--font-body);
      font-size: 14px;
    }

    /* ===== LIST ITEMS ===== */
    ion-item {
      --background: transparent;
      --background-hover: rgba(26,47,35,0.05);
      --color: var(--ink);
      --border-color: rgba(61,53,40,0.14);
      font-family: var(--font-body);
      cursor: pointer;
    }
    ion-item ion-label h2 {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      color: var(--surveyor);
      line-height: 1.25;
    }
    ion-item ion-label p {
      font-family: var(--font-body);
      font-size: 12.5px;
      color: var(--ink-soft);
    }

    /* Result count label */
    #result-block {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sage);
    }

    /* ===== ION-LABEL / ION-RANGE ===== */
    ion-label {
      font-family: var(--font-body);
      color: var(--ink-soft);
      font-size: 13px;
    }
    ion-range {
      --bar-background: rgba(61,53,40,0.2);
      --bar-background-active: var(--surveyor);
      --knob-background: var(--surveyor);
      --pin-background: var(--surveyor);
      --pin-color: var(--paper);
    }

    /* ===== DESKTOP TAB BAR (in sidebar) ===== */
    ion-tab-bar {
      --background: var(--paper-deep);
      border-top: 1px solid rgba(61,53,40,0.18);
      border-bottom: 1px solid rgba(61,53,40,0.18);
    }
    ion-tab-button {
      --color: var(--ink-soft);
      --color-selected: var(--surveyor);
      font-family: var(--font-body);
      font-size: 11px;
    }
    ion-tab-button[selected] {
      border-bottom: 2px solid var(--route);
    }
    ion-badge {
      --background: var(--route);
      --color: var(--paper);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    /* ===== PULSING DOT ===== */
    .pulsing-dot {
      width: 20px; height: 20px;
      background-color: var(--route);
      border-radius: 50%; position: absolute;
      transform: translate(-50%,-50%);
      pointer-events: none;
    }
    .pulsing-dot::before, .pulsing-dot::after {
      content: ""; display: block; position: absolute;
      top: 0; left: 0; width: 20px; height: 20px;
      border-radius: 50%; z-index: -1;
      animation: pulse-grow 1.3s ease-in-out infinite;
    }
    .pulsing-dot::before { background: rgba(199,93,58,0.6); animation-delay: -0.5s; }
    .pulsing-dot::after  { background: rgba(199,93,58,0.3); }
    @keyframes pulse-grow {
      0%   { transform: scale(1);   opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* ===== RIGHT DRAWER (desktop only) ===== */
    #viewerDrawer {
      position: fixed; top: 0; right: 0;
      width: 30%; min-width: 280px;
      height: calc(100% - 56px); margin-top: 56px;
      background: var(--paper-deep);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
      z-index: 999;
      box-shadow: -4px 0 24px rgba(26,47,35,0.14);
      border-left: 1px solid rgba(61,53,40,0.18);
    }
    #viewerDrawer.open { transform: translateX(0); }

    #viewer-header {
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; min-height: 56px; padding: 0 8px 0 16px;
      background: var(--paper-deep);
      border-bottom: 1px solid rgba(61,53,40,0.18);
      flex-shrink: 0;
    }
    #viewer-header ion-title {
      padding: 0;
      font-family: var(--font-display);
      font-size: 15px; font-weight: 600;
      color: var(--surveyor); flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #viewer-header ion-button { --color: var(--ink-soft); --color-hover: var(--route); }

    #viewer-body {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
      background: var(--paper-deep);
    }
    #osd-container { width: 100%; flex: 1; min-height: 300px; background: var(--surveyor); }
    #osd-placeholder {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; color: var(--sage);
      font-family: var(--font-mono); font-size: 13px; gap: 12px;
    }
    #osd-placeholder ion-icon { font-size: 48px; color: var(--sage); opacity: 0.5; }
    #viewer-meta {
      padding: 8px 12px;
      background: var(--paper);
      color: var(--sage);
      font-family: var(--font-mono);
      font-size: 11px;
      border-top: 1px solid rgba(61,53,40,0.14);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #photo-meta-panel summary::-webkit-details-marker { display: none; }
    #photo-meta-panel[open] summary {
      border-bottom: 1px solid rgba(61,53,40,0.14);
    }

    /* ===== MINE PANEL ===== */
    .mine-panel-inner {
      font-family: var(--font-body);
      font-size: 14px; line-height: 1.65;
      padding: 16px; color: var(--ink);
      background: var(--paper-deep);
    }
    .mine-panel-inner h3 {
      font-family: var(--font-mono);
      font-size: 11px; font-weight: 500;
      color: var(--route);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 20px 0 8px;
      border-bottom: 1px solid rgba(61,53,40,0.18);
      padding-bottom: 4px;
    }
    .mine-panel-inner h3:first-child { margin-top: 0; }
    .mine-panel-inner p { margin: 3px 0; color: var(--ink-soft); font-size: 14px; }
    .mine-panel-inner strong { color: var(--surveyor); font-weight: 600; }
    .mine-panel-inner a { color: var(--route); font-weight: 600; border-bottom: 1px solid rgba(199,93,58,0.4); }
    .mine-panel-inner a:hover { color: var(--route-deep); }
    .mine-panel-inner table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
    .mine-panel-inner th {
      text-align: left;
      font-family: var(--font-mono); font-size: 10px;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--sage);
      padding: 5px 8px;
      border-bottom: 1px solid rgba(61,53,40,0.18);
    }
    .mine-panel-inner td {
      padding: 5px 8px;
      border-bottom: 1px solid rgba(61,53,40,0.1);
      color: var(--ink-soft);
    }
    .mine-panel-inner tr:hover td { background: rgba(26,47,35,0.04); }

    /* ===== ESRI POPUP ===== */
    .esri-popup__header-title { font-family: var(--font-display) !important; }
    .esri-popup__content { font-family: var(--font-body) !important; }

    /* ===== OPACITY SLIDER OVERLAY (mobile only) ===== */
    #sliderOverlay { display: none; }
    @media (max-width: 768px) {
      #sliderOverlay {
        display: flex;
        position: fixed; top: 56px; left: 0; right: 0;
        z-index: 500;
        background: rgba(244,236,216,0.92);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(61,53,40,0.18);
        padding: 4px 16px;
        align-items: center; gap: 10px;
      }
      #sliderOverlay ion-label { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
      #sliderOverlay ion-range { flex: 1; }
    }

    /* ===== MOBILE BOTTOM TABS ===== */
    #mobileTabBar {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 600;
      --background: var(--paper-deep);
      border-top: 1px solid rgba(61,53,40,0.18);
    }
    #mobileTabBar ion-tab-button { --color: var(--ink-soft); --color-selected: var(--surveyor); }
    #mobileTabBar ion-tab-button[selected] { border-top: 2px solid var(--route); }

    /* ===== GPS FAB (mobile only) ===== */
    #gpsFab {
      display: none;
      position: fixed; bottom: 70px; right: 16px; z-index: 700;
    }
    ion-fab-button {
      --background: var(--paper);
      --background-activated: var(--paper-deep);
      --color: var(--surveyor);
      --box-shadow: 0 2px 8px rgba(26,47,35,0.18);
      border: 1px solid rgba(61,53,40,0.2);
    }
    ion-fab-button.active {
      --background: var(--surveyor);
      --color: var(--paper);
    }

    /* ===== MOBILE SHEET MODAL ===== */
    ion-modal#sheetModal {
      --height: 50%;
      --border-radius: 12px 12px 0 0;
      --background: var(--paper-deep);
      --box-shadow: 0 -4px 24px rgba(26,47,35,0.14);
    }
    .sheet-modal-content {
      display: flex; flex-direction: column; height: 100%;
      background: var(--paper-deep);
    }
    .sheet-modal-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: rgba(61,53,40,0.25);
      margin: 10px auto 6px; flex-shrink: 0;
    }
    .sheet-search { padding: 0 8px 6px; flex-shrink: 0; }
    .sheet-results { flex: 1; overflow-y: auto; }
    #mobile-result-block {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--sage); padding: 0 8px 4px;
    }

    /* ===== MOBILE PHOTO MODAL ===== */
    ion-modal#photoModal {
      --height: 50%;
      --border-radius: 12px 12px 0 0;
      --box-shadow: 0 -4px 24px rgba(26,47,35,0.14);
    }

    /* ===== MINE MODAL ===== */
    ion-modal#mineModal {
      --border-radius: var(--radius);
      --background: var(--paper-deep);
    }
    ion-modal#mineModal ion-toolbar {
      --background: var(--paper-deep);
      --color: var(--surveyor);
      border-bottom: 1px solid rgba(61,53,40,0.18);
    }
    ion-modal#mineModal ion-title {
      font-family: var(--font-display);
      font-size: 16px; font-weight: 600;
      color: var(--surveyor);
    }
    #mineModalContent {
      height: 100%; overflow-y: auto;
      background: var(--paper-deep);
    }

    /* ===== RESPONSIVE BREAKPOINT ===== */
    @media (max-width: 768px) {
      ion-split-pane { --side-max-width: 0; --side-min-width: 0; }
      ion-menu[side="start"] { display: none !important; }
      #viewerDrawer { display: none !important; }
      #mobileTabBar { display: flex !important; }
      #gpsFab       { display: block !important; }
      #viewDiv { height: calc(100% - 56px) !important; }
    }
  </style>
</head>

<body>
<ion-app>

  <ion-header>
    <ion-toolbar>
      <ion-title>
        <img src="dmilogo.png" width="60" height="60" style="vertical-align:middle;">
        &nbsp; UP Iron Atlas beta
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Opacity slider — mobile only, floats under navbar -->
  <div id="sliderOverlay">
    <ion-label>Opacity</ion-label>
    <ion-range id="sliderMobile" min="0" max="100" value="100" pin="true" mode="ios"></ion-range>
  </div>

  <ion-content>
    <ion-split-pane content-id="main">

      <!-- ===== LEFT SIDEBAR (desktop only) ===== -->
      <ion-menu content-id="main" side="start" type="overlay" swipe-gesture="false">
        <ion-header>
          <ion-toolbar color="dark"><ion-title>Filters</ion-title></ion-toolbar>
        </ion-header>
        <ion-content id="filters">
          <ion-searchbar id="searchBar" placeholder="Search people, places, and photos"></ion-searchbar>
          <img id="image" src="" alt="Picture" style="display:none;">

          <!-- Opacity slider (desktop sidebar) -->
          <ion-item>
            <ion-label>Overlay Opacity</ion-label>
          </ion-item>
          <ion-item>
            <ion-range id="slider" min="0" max="100" value="100" pin="true" mode="ios"></ion-range>
          </ion-item>

          <!-- Desktop tab bar -->
          <ion-tab-bar id="mainTabBar" selected-tab="maps">
            <ion-tab-button tab="maps">
              <ion-icon name="map"></ion-icon>
              <ion-label>Maps</ion-label>
              <ion-badge id="badge-maps" color="danger">0</ion-badge>
            </ion-tab-button>
            <ion-tab-button tab="places">
              <ion-icon name="business"></ion-icon>
              <ion-label>Places</ion-label>
              <ion-badge id="badge-places" color="danger">0</ion-badge>
            </ion-tab-button>
            <ion-tab-button tab="photos">
              <ion-icon name="camera"></ion-icon>
              <ion-label>Photos</ion-label>
              <ion-badge id="badge-photos" color="danger">0</ion-badge>
            </ion-tab-button>
            <ion-tab-button tab="people">
              <ion-icon name="people"></ion-icon>
              <ion-label>People</ion-label>
              <ion-badge id="badge-people" color="danger">0</ion-badge>
            </ion-tab-button>
          </ion-tab-bar>

          <!-- Desktop results list -->
          <ion-list id="resultsDiv">
            <ion-item><ion-label id="result-block">Results</ion-label></ion-item>
            <ion-list id="result-list"></ion-list>
          </ion-list>
        </ion-content>
      </ion-menu>

      <!-- ===== MAP ===== -->
      <div class="ion-page" id="main">
        <div id="viewDiv"></div>
      </div>

    </ion-split-pane>

    <!-- ===== RIGHT DRAWER (desktop only) ===== -->
    <div id="viewerDrawer">
      <div id="viewer-header">
        <ion-title id="viewer-title">Photo Viewer</ion-title>
        <ion-button fill="clear" id="closeViewerBtn" color="light">
          <ion-icon slot="icon-only" name="close"></ion-icon>
        </ion-button>
      </div>
      <div id="viewer-body">
        <div id="osd-container">
          <div id="osd-placeholder">
            <ion-icon name="camera-outline"></ion-icon>
            <span>Select a photo point on the map</span>
          </div>
        </div>
        <div id="viewer-meta"></div>
        <!-- Photo metadata panel -->
        <details id="photo-meta-panel" style="display:none;">
          <summary style="
            font-family: var(--font-mono); font-size: 11px; font-weight: 500;
            letter-spacing: 0.08em; text-transform: uppercase; color: var(--route);
            padding: 10px 14px; cursor: pointer; list-style: none;
            border-top: 1px solid rgba(61,53,40,0.14);
            background: var(--paper-deep);
            display: flex; align-items: center; gap: 6px;
          ">
            <ion-icon name="information-circle-outline" style="font-size:14px;"></ion-icon>
            Image Details
          </summary>
          <div id="photo-meta-content" class="mine-panel-inner" style="padding: 12px 14px;"></div>
        </details>
        <div id="mine-panel-desktop" style="display:none;">
          <div id="mine-loading-desktop" style="text-align:center;padding:40px;color:#888;">
            <ion-spinner name="crescent"></ion-spinner>
            <p>Loading mine data...</p>
          </div>
          <div id="mine-content-desktop" class="mine-panel-inner" style="display:none;"></div>
        </div>
      </div>
    </div>

    <!-- ===== MOBILE SHEET MODAL (Maps/Places/Photos/People) ===== -->
    <ion-modal id="sheetModal">
      <div class="sheet-modal-content">
        <div class="sheet-modal-handle"></div>
        <div class="sheet-search">
          <div style="display:flex;align-items:center;gap:8px;">
            <ion-searchbar id="mobileSearchBar" placeholder="Search..." style="flex:1;"></ion-searchbar>
            <ion-button fill="clear" color="medium" id="closeSheetBtn" style="flex-shrink:0;">
              <ion-icon slot="icon-only" name="close-circle"></ion-icon>
            </ion-button>
          </div>
          <div id="mobile-result-block" style="color:#aaa;font-size:13px;padding:0 4px 4px;">Results</div>
        </div>
        <div class="sheet-results">
          <ion-list id="mobile-result-list"></ion-list>
        </div>
      </div>
    </ion-modal>

    <!-- ===== MOBILE PHOTO SHEET MODAL ===== -->
    <ion-modal id="photoModal">
      <div style="display:flex;flex-direction:column;height:100%;background:#111;">
        <div style="display:flex;align-items:center;justify-content:flex-end;padding:4px 8px;background:#1a1a1a;flex-shrink:0;">
          <ion-button fill="clear" color="medium" id="closePhotoModalBtn">
            <ion-icon slot="icon-only" name="close-circle"></ion-icon>
          </ion-button>
        </div>
        <div id="mobileOsdContainer" style="flex:1;min-height:200px;"></div>
        <div id="mobile-viewer-meta" style="padding:8px 12px;background:#1a1a1a;color:#ccc;font-size:12px;border-top:1px solid #333;"></div>
      </div>
    </ion-modal>

    <!-- ===== MOBILE MINE MODAL ===== -->
    <ion-modal id="mineModal">
      <ion-header>
        <ion-toolbar color="dark">
          <ion-title id="mine-modal-title">Mine Details</ion-title>
          <ion-buttons slot="end">
            <ion-button id="closeMineModalBtn">
              <ion-icon slot="icon-only" name="close"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <div id="mineModalContent">
        <div id="mine-loading-mobile" style="text-align:center;padding:40px;color:#888;">
          <ion-spinner name="crescent"></ion-spinner>
          <p>Loading mine data...</p>
        </div>
        <div id="mine-content-mobile" class="mine-panel-inner" style="display:none;"></div>
      </div>
    </ion-modal>

  </ion-content>

  <!-- ===== MOBILE BOTTOM TAB BAR ===== -->
  <ion-tab-bar id="mobileTabBar">
    <ion-tab-button id="mob-tab-maps" tab="maps">
      <ion-icon name="map"></ion-icon>
      <ion-label>Maps</ion-label>
      <ion-badge id="mob-badge-maps" color="danger">0</ion-badge>
    </ion-tab-button>
    <ion-tab-button id="mob-tab-places" tab="places">
      <ion-icon name="business"></ion-icon>
      <ion-label>Places</ion-label>
      <ion-badge id="mob-badge-places" color="danger">0</ion-badge>
    </ion-tab-button>
    <ion-tab-button id="mob-tab-photos" tab="photos">
      <ion-icon name="camera"></ion-icon>
      <ion-label>Photos</ion-label>
      <ion-badge id="mob-badge-photos" color="danger">0</ion-badge>
    </ion-tab-button>
    <ion-tab-button id="mob-tab-people" tab="people">
      <ion-icon name="people"></ion-icon>
      <ion-label>People</ion-label>
      <ion-badge id="mob-badge-people" color="danger">0</ion-badge>
    </ion-tab-button>
  </ion-tab-bar>

  <!-- ===== GPS FAB (mobile only) ===== -->
  <div id="gpsFab">
    <ion-fab-button id="gpsBtn" color="dark" size="small">
      <ion-icon id="gpsIcon" name="locate-outline"></ion-icon>
    </ion-fab-button>
  </div>

</ion-app>

<script>
  require([
    "esri/Map",
    "esri/views/MapView",
    "esri/layers/FeatureLayer",
    "esri/layers/GraphicsLayer",
    "esri/Graphic",
    "esri/layers/TileLayer",
    "esri/layers/WebTileLayer",
    "esri/widgets/Home",
    "esri/widgets/Track",
    "esri/core/reactiveUtils"
  ], (Map, MapView, FeatureLayer, GraphicsLayer, Graphic, TileLayer, WebTileLayer, Home, Track, reactiveUtils) => (async () => {

    const isMobile = () => window.innerWidth <= 768;

    const invisibleRenderer = {
      type: "simple",
      symbol: { type: "simple-fill", color: [255,128,0,0], outline: { width: 0, color: [0,0,0,0] } }
    };

    const fpRenderer = {
      type: "simple",
      symbol: { type: "picture-marker", url: "marker_picture_black.svg", width: "25px", height: "25px" }
    };

    // Viewshed: semi-transparent route-red fill, solid outline
    const vsRenderer = {
      type: "simple",
      symbol: {
        type: "simple-fill",
        color: [199, 93, 58, 0.18],   // --route at 18% opacity
        outline: { color: [199, 93, 58, 0.85], width: 1.5 }
      }
    };

    // Building footprints: surveyor-green outline only, stands out over viewshed
    const bldgRenderer = {
      type: "simple",
      symbol: {
        type: "simple-fill",
        color: [0, 0, 0, 0],
        outline: { color: [26, 47, 35, 1], width: 2 }  // --surveyor, solid, 2px
      }
    };

    // Scale threshold: ~zoom 10 boundary in Web Mercator
    const OVERVIEW_SCALE = 144448;  // roughly zoom 10

    // --- Layers ---
    const indexLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/UP_Iron_Atlas_Index_Map/FeatureServer/0",
      outFields: ["*"], renderer: invisibleRenderer, maxScale: 24, minScale: 0
    });
    const poiLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/Iron_Atlas_POIs/FeatureServer/0",
      outFields: ["*"], renderer: invisibleRenderer, maxScale: 24, minScale: 0
    });
    const vsLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/IronRangeViewsheds_joined/FeatureServer/0",
      outFields: ["*"], renderer: vsRenderer, maxScale: 24, minScale: 0
    });
    const fpLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/Iron_Atlas_FP_Joined/FeatureServer/0",
      outFields: ["*"], renderer: fpRenderer,
      minScale: OVERVIEW_SCALE, maxScale: 0, id: "fp"
    });
    const cdLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/Iron_Range_City_Directory_Data/FeatureServer/0",
      outFields: ["*"], renderer: invisibleRenderer, maxScale: 24, minScale: 0
    });
    const bldgLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/IronRangeBuildingFootprints/FeatureServer/0",
      outFields: ["*"], renderer: bldgRenderer, maxScale: 24, minScale: 0, id: "bldg"
    });
    const minesLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/IronRangeMinesLocations/FeatureServer/0",
      outFields: ["site_name", "url", "dep_id"],
      renderer: { type: "simple", symbol: { type: "simple-marker", color: [180,60,20], size: 10, outline: { color: [255,255,255], width: 1 } } },
      id: "mines"
    });
    minesLayer.popupTemplate = {
      title: "{site_name}",
      content: [{ type: "text", text: `<a href="{url}" target="_blank">{url}</a>` }]
    };

    // Iron Range boundaries — visible at overview zoom only, labels at all boundary-visible scales
    const boundaryLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/Iron_Range_Boundaries/FeatureServer/0",
      outFields: ["*"],
      minScale: 0,                   // always on from zoom 0
      maxScale: OVERVIEW_SCALE,      // disappears when fp icons appear
      renderer: {
        type: "simple",
        symbol: {
          type: "simple-fill",
          color: [0, 0, 0, 0],
          outline: {
            type: "simple-line",
            color: [199, 93, 58, 0.8],
            width: 1.5,
            style: "dash"
          }
        }
      },
      labelsVisible: true,
      labelingInfo: [{
        labelExpressionInfo: {
          expression: `
            var n = $feature.Name;
            if (IsEmpty(n)) n = $feature.name;
            if (IsEmpty(n)) n = $feature.NAME;
            return n;
          `
        },
        symbol: {
          type: "text",
          color: [26, 47, 35, 1],
          haloColor: [244, 236, 216, 0.95],
          haloSize: "2px",
          font: { family: "JetBrains Mono", size: 11, weight: "bold" }
        },
        minScale: 0,
        maxScale: OVERVIEW_SCALE
      }],
      popupEnabled: false,
      id: "boundary"
    });

    const markerLayer = new GraphicsLayer({ id: "markers" });

    // --- Map & View ---
    // Layer order: indexLayer, boundaryLayer, [Sanborn at pos 2], markerLayer, fpLayer, vsLayer, bldgLayer, minesLayer
    const map = new Map({
      basemap: "satellite",
      layers: [indexLayer, boundaryLayer, markerLayer, fpLayer, vsLayer, bldgLayer, minesLayer]
    });
    const view = new MapView({
      container: "viewDiv", map,
      center: [-88.5694, 47.1211], zoom: 7,
      highlightOptions: { color: [255,204,0], haloOpacity: 1, fillOpacity: 0 }
    });
    // Disable ArcGIS popup on mobile — we use sheet modals instead
    if (isMobile()) {
      view.popup.autoOpenEnabled = false;
    } else {
      view.popup = { dockEnabled: true, dockOptions: { buttonEnabled: false, breakpoint: false } };
    }
    view.ui.add(new Home({ view }), "top-left");
    view.ui.move("zoom", "top-left");

    fpLayer.popupTemplate   = { title: "photopoint", content: "Description" };
    bldgLayer.popupTemplate  = { title: "photopoint", content: "Description" };
    vsLayer.definitionExpression   = "img_id = '0000000000000000000000000000'";
    bldgLayer.definitionExpression = "img_id = '0000000000000000000000000000'";

    // --- GPS Track widget (mobile FAB) ---
    const trackWidget = new Track({ view, useHeadingEnabled: false, goToLocationEnabled: false });
    let trackActive = false;

    document.getElementById("gpsBtn").addEventListener("click", () => {
      if (!trackActive) {
        trackWidget.start();
        trackActive = true;
        document.getElementById("gpsIcon").setAttribute("name", "locate");
        document.getElementById("gpsBtn").classList.add("active");
      } else {
        trackWidget.stop();
        trackActive = false;
        document.getElementById("gpsIcon").setAttribute("name", "locate-outline");
        document.getElementById("gpsBtn").classList.remove("active");
      }
    });

    // --- OSD Setup (desktop) ---
    const IIIF_BASE = "https://cchi-iif.mtu.edu/iiif/3";

    const osdViewer = OpenSeadragon({
      id: "osd-container",
      prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
      showNavigationControl: true, showNavigator: true,
      navigatorPosition: "BOTTOM_RIGHT",
      animationTime: 0.5, immediateRender: false, wrapHorizontal: false
    });

    // Mobile OSD (inside photo sheet modal)
    let mobileOsdViewer = null;

    function getMobileOsd() {
      if (!mobileOsdViewer) {
        mobileOsdViewer = OpenSeadragon({
          id: "mobileOsdContainer",
          prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
          showNavigationControl: true, showNavigator: false,
          animationTime: 0.5, immediateRender: false, wrapHorizontal: false
        });
      }
      return mobileOsdViewer;
    }

    function openIIIFImage(imgId, attrs) {
      const placeholder = document.getElementById("osd-placeholder");
      if (placeholder) placeholder.style.display = "none";
      const manifestUrl = `${IIIF_BASE}/${imgId}/info.json`;
      osdViewer.open(manifestUrl);
      // Title: prefer metadata Title, fall back to filename stem
      const title = attrs?.Title || imgId.replace(/\.[^/.]+$/, "");
      document.getElementById("viewer-title").innerText = title;
      document.getElementById("viewer-meta").innerText = manifestUrl;
      // Populate collapsible metadata panel
      const panel   = document.getElementById("photo-meta-panel");
      const content = document.getElementById("photo-meta-content");
      if (attrs) {
        content.innerHTML = `
          ${attrs.Title       ? `<h3>Title</h3><p><strong>${attrs.Title}</strong></p>` : ""}
          ${attrs.Year        ? `<h3>Year</h3><p>${attrs.Year}</p>` : ""}
          ${attrs.Description ? `<h3>Description</h3><p>${attrs.Description}</p>` : ""}
          ${attrs.Source      ? `<h3>Source</h3><p>${attrs.Source}</p>` : ""}
        `;
        panel.style.display = "block";
      } else {
        panel.style.display = "none";
      }
    }

    function openMobileIIIFImage(imgId, attrs) {
      const manifestUrl = `${IIIF_BASE}/${imgId}/info.json`;
      getMobileOsd().open(manifestUrl);
      const title = attrs?.Title || imgId.replace(/\.[^/.]+$/, "");
      document.getElementById("mobile-viewer-meta").innerText =
        [title, attrs?.Year, attrs?.Source].filter(Boolean).join(" · ");
    }

    // --- Desktop drawer ---
    function openDrawer()  { document.getElementById("viewerDrawer").classList.add("open"); }
    function closeDrawer() { document.getElementById("viewerDrawer").classList.remove("open"); }
    document.getElementById("closeViewerBtn").addEventListener("click", closeDrawer);

    function setDrawerMode(mode) {
      document.getElementById("osd-container").style.display         = mode === "photo" ? "block" : "none";
      document.getElementById("viewer-meta").style.display           = mode === "photo" ? "block" : "none";
      document.getElementById("photo-meta-panel").style.display      = mode === "photo" ? "block" : "none";
      document.getElementById("mine-panel-desktop").style.display    = mode === "mine"  ? "block" : "none";
    }

    async function openViewerDrawer(imgId, attrs) {
      setDrawerMode("photo");
      openDrawer();
      setTimeout(() => openIIIFImage(imgId, attrs), 300);
    }

    // --- Mobile sheet modal ---
    const sheetModal = document.getElementById("sheetModal");
    const photoModal = document.getElementById("photoModal");
    const mineModal  = document.getElementById("mineModal");

    // Breakpoints must be set as JS arrays — HTML attribute strings cause t.sort errors
    await sheetModal.componentOnReady();
    sheetModal.breakpoints        = [0, 0.25, 0.5, 0.75, 1];
    sheetModal.initialBreakpoint  = 0.5;
    sheetModal.backdropBreakpoint = 1;
    sheetModal.handle             = false;

    await photoModal.componentOnReady();
    photoModal.breakpoints        = [0, 0.25, 0.5, 0.75, 1];
    photoModal.initialBreakpoint  = 0.5;
    photoModal.backdropBreakpoint = 1;
    photoModal.handle             = false;

    document.getElementById("closeMineModalBtn").addEventListener("click", () => mineModal.dismiss());
    document.getElementById("closeSheetBtn").addEventListener("click", async () => {
      await sheetModal.dismiss();
      sheetOpen = false;
      document.querySelectorAll("#mobileTabBar ion-tab-button").forEach(b => b.removeAttribute("selected"));
    });
    document.getElementById("closePhotoModalBtn").addEventListener("click", () => photoModal.dismiss());

    let mobileActiveTab = "maps";
    let sheetOpen = false;

    // Re-present a modal that may have been previously dismissed
    async function presentModal(modal) {
      // ion-modal needs to be re-attached to DOM after dismiss in some Ionic versions
      // Safest: always try dismiss first (silently), then present
      try { await modal.dismiss(); } catch(e) {}
      await modal.present();
    }

    async function openSheetWithTab(tab) {
      mobileActiveTab = tab;
      await populateMobileResults(document.getElementById("mobileSearchBar").value || "");
      await presentModal(sheetModal);
      sheetOpen = true;
      document.querySelectorAll("#mobileTabBar ion-tab-button").forEach(b => b.removeAttribute("selected"));
      document.getElementById(`mob-tab-${tab}`).setAttribute("selected", "true");
    }

    async function openMobilePhotoViewer(imgId, attrs) {
      await presentModal(photoModal);
      setTimeout(() => openMobileIIIFImage(imgId, attrs), 400);
    }

    sheetModal.addEventListener("ionModalDidDismiss", () => { sheetOpen = false; });

    // Mobile tab bar clicks — toggle behavior
    document.querySelectorAll("#mobileTabBar ion-tab-button").forEach(btn => {
      btn.addEventListener("click", async () => {
        const tab = btn.getAttribute("tab");
        if (sheetOpen && mobileActiveTab === tab) {
          await sheetModal.dismiss();
          sheetOpen = false;
          document.querySelectorAll("#mobileTabBar ion-tab-button").forEach(b => b.removeAttribute("selected"));
        } else {
          await openSheetWithTab(tab);
        }
      });
    });

    document.getElementById("mobileSearchBar").addEventListener("ionInput", () => {
      populateMobileResults(document.getElementById("mobileSearchBar").value || "");
    });

    // --- Building highlight (shared) ---
    const BLDG_DOT_ID = "bldg-highlight-dot";

    function clearBldgHighlight() { osdViewer.removeOverlay(BLDG_DOT_ID); }

    function highlightBldgInOSD(imgCoords, viewer = osdViewer) {
      if (viewer === osdViewer) clearBldgHighlight();
      const parts = imgCoords.split(",");
      if (parts.length < 2) return;
      const imageX = parseFloat(parts[0]);
      const imageY = parseFloat(parts[1]);
      if (isNaN(imageX) || isNaN(imageY)) return;
      const tiledImage = viewer.world.getItemAt(0);
      if (!tiledImage) return;
      const vp = tiledImage.imageToViewportCoordinates(new OpenSeadragon.Point(imageX, imageY));
      const dot = document.createElement("div");
      dot.className = "pulsing-dot";
      dot.id = BLDG_DOT_ID;
      viewer.addOverlay({ element: dot, location: vp });
      const d = 0.15;
      viewer.viewport.fitBounds(new OpenSeadragon.Rect(vp.x-d, vp.y-d, d*2, d*2), false);
    }

    // --- Opacity slider ---

    document.getElementById("slider").addEventListener("ionInput", (ev) => {
      if (currentOverlayLayer) currentOverlayLayer.opacity = ev.target.value / 100;
    });
    document.getElementById("sliderMobile").addEventListener("ionInput", (ev) => {
      if (currentOverlayLayer) currentOverlayLayer.opacity = ev.target.value / 100;
    });

    // --- Mine panel HTML builder ---
    const USGS_BASE = "https://mrdata.usgs.gov/mrds/json";

    function formatMinePanel(siteName, siteUrl, data) {
      const p   = data.properties;
      const dep = p.deposits || {};
      const loc = p.location || {};
      const geo = p.geo_coordinates || {};
      const owners     = Array.isArray(p.ownership)        ? p.ownership        : [];
      const materials  = Array.isArray(p.material)         ? p.material         : [];
      const production = Array.isArray(p.production)       ? p.production       : [];
      const plss       = Array.isArray(p.plss_coordinates) ? p.plss_coordinates : [];
      const commodity  = p.commodity || {};

      const ownerRows = owners.map(o =>
        `<tr><td>${o.owner_name??""}</td><td>${o.owner_tp??""}</td><td>${o.beg_yr??""}${o.end_yr?"–"+o.end_yr:""}</td></tr>`
      ).join("");
      const matRows = materials.map(m =>
        `<tr><td>${m.material??""}</td><td>${m.ore_gangue??""}</td></tr>`
      ).join("");
      const prodRows = production.filter(r=>r.yr).sort((a,b)=>a.yr-b.yr)
        .map(r=>`<tr><td>${r.yr}</td><td>${Number(r.mined).toLocaleString()} ${r.units??""}</td><td>${r.item??""}</td></tr>`)
        .join("");
      const plssText = plss.map(p=>`T${p.township??""} R${p.range??""}, Sec ${p.section??""} ${p.sect_fract??""}`).join("<br>");

      return `
        <h3>Site</h3>
        <p><strong>${siteName}</strong></p>
        ${siteUrl?`<p><a href="${siteUrl}" target="_blank">Full record ↗</a></p>`:""}
        <p>${dep.dev_st??""} &bull; ${dep.dep_tp??""} &bull; ${dep.oper_tp??""}</p>
        <h3>Location</h3>
        <p>${loc.county??""} County, ${loc.state_prov??""}</p>
        <p>${geo.rel_pos??""}</p>
        ${plssText?`<p>${plssText}</p>`:""}
        <h3>Years of Operation</h3>
        <p>${dep.yr_fst_prd??"?"} – ${dep.yr_lst_prd??""}</p>
        ${dep.prod_yrs?`<p style="color:#aaa;font-size:12px;">${dep.prod_yrs}</p>`:""}
        <h3>Commodity</h3>
        <p>${commodity.commod??""} (${commodity.commod_tp??""}) &bull; ${commodity.import??""}</p>
        <h3>Materials</h3>
        <table><tr><th>Material</th><th>Type</th></tr>${matRows||"<tr><td colspan='2'>None recorded</td></tr>"}</table>
        <h3>Ownership</h3>
        <table><tr><th>Owner/Operator</th><th>Role</th><th>Years</th></tr>${ownerRows||"<tr><td colspan='3'>None recorded</td></tr>"}</table>
        <h3>Production by Year</h3>
        <table><tr><th>Year</th><th>Amount</th><th>Commodity</th></tr>${prodRows||"<tr><td colspan='3'>None recorded</td></tr>"}</table>
      `;
    }

    async function openMineDrawer(siteName, siteUrl, depId) {
      if (isMobile()) {
        // Mobile: use ion-modal
        document.getElementById("mine-modal-title").innerText = siteName ?? "Mine Details";
        document.getElementById("mine-loading-mobile").style.display = "block";
        document.getElementById("mine-content-mobile").style.display = "none";
        await mineModal.present();
        try {
          const data = await (await fetch(`${USGS_BASE}/${depId}`)).json();
          document.getElementById("mine-content-mobile").innerHTML = formatMinePanel(siteName, siteUrl, data);
          document.getElementById("mine-loading-mobile").style.display = "none";
          document.getElementById("mine-content-mobile").style.display = "block";
        } catch(e) {
          document.getElementById("mine-loading-mobile").innerHTML =
            `<p style="color:#f66;">Failed to load USGS data.</p>${siteUrl?`<p><a href="${siteUrl}" target="_blank">View full record ↗</a></p>`:""}`;
        }
      } else {
        // Desktop: use right drawer
        setDrawerMode("mine");
        document.getElementById("viewer-title").innerText = siteName ?? "Mine Details";
        document.getElementById("mine-loading-desktop").style.display = "block";
        document.getElementById("mine-content-desktop").style.display = "none";
        openDrawer();
        try {
          const data = await (await fetch(`${USGS_BASE}/${depId}`)).json();
          document.getElementById("mine-content-desktop").innerHTML = formatMinePanel(siteName, siteUrl, data);
          document.getElementById("mine-loading-desktop").style.display = "none";
          document.getElementById("mine-content-desktop").style.display = "block";
        } catch(e) {
          document.getElementById("mine-loading-desktop").innerHTML =
            `<p style="color:#f66;">Failed to load USGS data.</p>${siteUrl?`<p><a href="${siteUrl}" target="_blank">View full record ↗</a></p>`:""}`;
        }
      }
    }

    // --- Segment config ---
    const segmentConfig = {
      maps: {
        layer: indexLayer, layerView: null,
        titleField: "title", subtitleField: "mapyear",
        searchFields: v => `(Upper(title) LIKE '%${v.toUpperCase()}%' OR Upper(tags) LIKE '%${v.toUpperCase()}%' OR datapub LIKE '%${v}%')`
      },
      places: {
        layer: poiLayer, layerView: null,
        titleField: "Name", subtitleField: "Address",
        searchFields: v => `(Upper(Name) LIKE '%${v.toUpperCase()}%' OR Upper(Address) LIKE '%${v.toUpperCase()}%')`
      },
      photos: {
        layer: vsLayer, layerView: null,
        titleField: "Title", subtitleField: "Year",
        searchFields: v => `(Upper(Title) LIKE '%${v.toUpperCase()}%' OR Upper(Description) LIKE '%${v.toUpperCase()}%' OR Upper(Source) LIKE '%${v.toUpperCase()}%' OR Upper(img_id) LIKE '%${v.toUpperCase()}%')`
      },
      people: {
        layer: cdLayer, layerView: null,
        titleField: "Name", subtitleField: "Occupation",
        searchFields: v => `(Upper(Name) LIKE '%${v.toUpperCase()}%' OR Upper(Occupation) LIKE '%${v.toUpperCase()}%' OR Upper(Address) LIKE '%${v.toUpperCase()}%')`
      }
    };

    const indexLayerView = await view.whenLayerView(indexLayer);
    segmentConfig.maps.layerView = indexLayerView;
    map.addMany([poiLayer, cdLayer]);

    const [poiLV, vsLV, cdLV] = await Promise.all([
      view.whenLayerView(poiLayer),
      view.whenLayerView(vsLayer),
      view.whenLayerView(cdLayer)
    ]);
    segmentConfig.places.layerView = poiLV;
    segmentConfig.photos.layerView = vsLV;
    segmentConfig.people.layerView = cdLV;

    let currentOverlayLayer = null;
    let activeSegment = "maps";

    function buildWhereClause(cfg, searchVal, segment) {
      const clauses = [];
      if (searchVal?.trim()) {
        clauses.push(cfg.searchFields(searchVal.trim()));
      } else if (segment === "maps") {
        // Only apply zoom filter when zoom is a valid number
        const z = Math.round(view.zoom);
        if (!isNaN(z) && z > 0) {
          clauses.push(`(minzoom IS NULL OR minzoom <= ${z})`);
          clauses.push(`(maxzoom IS NULL OR maxzoom >= ${z})`);
        }
      }
      return clauses.length ? clauses.join(" AND ") : "1=1";
    }

    async function queryLayerInExtent(cfg, searchVal, segment) {
      const q = cfg.layer.createQuery();
      q.returnGeometry = true;
      q.outFields = ["*"];
      q.where = buildWhereClause(cfg, searchVal, segment);
      // Only restrict to map extent when NOT actively searching AND extent is valid
      if (!searchVal?.trim() && view.extent) {
        q.geometry = view.extent;
      }
      return (await cfg.layer.queryFeatures(q)).features;
    }

    function sortFeatures(features, segment) {
      if (segment !== "maps") return features;
      return [...features].sort((a, b) => {
        const ta = (a.attributes.title ?? "").toUpperCase();
        const tb = (b.attributes.title ?? "").toUpperCase();
        if (ta < tb) return -1; if (ta > tb) return 1;
        return (parseInt(b.attributes.mapyear)||0) - (parseInt(a.attributes.mapyear)||0);
      });
    }

    // --- Badges (shared — updates both desktop and mobile) ---
    async function updateAllBadges(searchVal) {
      const tabs = ["maps","places","photos","people"];
      await Promise.all(tabs.map(async tab => {
        const cfg = segmentConfig[tab];
        try {
          const q = cfg.layer.createQuery();
          q.geometry = view.extent;
          q.where = buildWhereClause(cfg, searchVal, tab);
          const count = await cfg.layer.queryFeatureCount(q);
          const b1 = document.getElementById(`badge-${tab}`);
          const b2 = document.getElementById(`mob-badge-${tab}`);
          if (b1) b1.innerText = count;
          if (b2) b2.innerText = count;
        } catch(e) {}
      }));
    }

    // --- Result item click handler (shared logic) ---
    async function handleResultClick(feature, segment) {
      if (segment === "maps") {
        loadMapOverlay(feature);
      } else if (segment === "photos") {
        const imgId   = feature.attributes.img_id;
        const mapcode = feature.attributes.mapyear;
        vsLayer.definitionExpression   = `img_id = '${imgId}'`;
        bldgLayer.definitionExpression = `img_id = '${imgId}'`;
        loadSanbornForMapcode(mapcode);
        clearBldgHighlight();
        const fpq = fpLayer.createQuery();
        fpq.where = `img_id = '${imgId}'`; fpq.returnGeometry = true; fpq.outFields = ["*"];
        const fpResult = await fpLayer.queryFeatures(fpq);
        if (fpResult.features.length) {
          const fpFeat = fpResult.features[0];
          const fpLV = await view.whenLayerView(fpLayer);
          fpLV.highlight(fpFeat);
          view.goTo({ center: fpFeat.geometry, zoom: 16 }, { duration: 600 });
        } else {
          view.goTo({ center: feature.geometry.centroid ?? feature.geometry }, { duration: 400 });
        }
        if (isMobile()) {
          await openMobilePhotoViewer(imgId, feature.attributes);
        } else {
          openViewerDrawer(imgId, feature.attributes);
        }
      } else {
        const geom = feature.geometry.type === "polygon" ? feature.geometry.centroid : feature.geometry;
        loadSanbornForMapcode(feature.attributes.mapyear);
        markerLayer.removeAll();
        markerLayer.add(new Graphic({
          geometry: geom,
          symbol: { type: "simple-marker", color: [255,204,0], size: 12, outline: { color: [0,0,0], width: 1.5 } }
        }));
        view.goTo({ center: geom, zoom: 17 }, { duration: 400 });
      }
    }

    // --- Build a result item element ---
    function buildResultItem(feature, segment) {
      const cfg   = segmentConfig[segment];
      const title = feature.attributes[cfg.titleField] ?? "(no title)";
      const sub   = feature.attributes[cfg.subtitleField] ?? "";
      const item  = document.createElement("ion-item");
      if (segment === "people") {
        const addr = feature.attributes.Address ?? "";
        const yr   = feature.attributes.dirYear ?? "";
        item.innerHTML = `<ion-label><h2>${title}</h2><p>${sub}</p><p>${addr}</p><p>${yr}</p></ion-label>`;
      } else if (segment === "photos") {
        const source = feature.attributes.Source ?? "";
        item.innerHTML = `<ion-label><h2>${title || feature.attributes.img_id}</h2><p>${sub}${source ? " · " + source : ""}</p></ion-label>`;
      } else {
        item.innerHTML = `<ion-label><h2>${title}</h2><p>${sub}</p></ion-label>`;
      }
      item.addEventListener("click", () => handleResultClick(feature, segment));
      return item;
    }

    // --- Desktop results ---
    async function populateResults(searchVal) {
      const cfg = segmentConfig[activeSegment];
      const resultList  = document.getElementById("result-list");
      const resultBlock = document.getElementById("result-block");
      resultList.innerHTML = ""; resultBlock.innerText = "Results";
      let features = [];
      try { features = await queryLayerInExtent(cfg, searchVal, activeSegment); }
      catch(e) { console.error("populateResults error:", e); resultBlock.innerText = "Results (unavailable)"; return; }
      features = sortFeatures(features, activeSegment);
      resultBlock.innerText = `Results (${features.length})`;
      if (cfg.layerView) {
        cfg.layerView.filter = { objectIds: features.map(f => f.attributes[cfg.layer.objectIdField] ?? f.attributes.OBJECTID) };
      }
      features.forEach(f => resultList.appendChild(buildResultItem(f, activeSegment)));
    }

    // --- Mobile results ---
    async function populateMobileResults(searchVal) {
      const cfg = segmentConfig[mobileActiveTab];
      const resultList  = document.getElementById("mobile-result-list");
      const resultBlock = document.getElementById("mobile-result-block");
      resultList.innerHTML = ""; resultBlock.innerText = "Results";
      let features = [];
      try { features = await queryLayerInExtent(cfg, searchVal, mobileActiveTab); }
      catch(e) { console.error("populateMobileResults error:", e); resultBlock.innerText = "Results (unavailable)"; return; }
      features = sortFeatures(features, mobileActiveTab);
      resultBlock.innerText = `Results (${features.length})`;
      features.forEach(f => resultList.appendChild(buildResultItem(f, mobileActiveTab)));
    }

    // --- Full refresh — updates BOTH desktop and mobile ---
    async function filterItems() {
      const searchVal = document.getElementById("searchBar").value || "";
      const mobileSearchVal = document.getElementById("mobileSearchBar").value || "";
      await Promise.all([
        updateAllBadges(searchVal || mobileSearchVal),
        populateResults(searchVal),
        ...(sheetOpen ? [populateMobileResults(mobileSearchVal)] : [])
      ]);
    }

    // --- Sanborn overlay ---
    async function loadSanbornForMapcode(mapcode) {
      if (!mapcode) return;
      const q = indexLayer.createQuery();
      q.where = `mapcode = '${mapcode}'`;
      q.outFields = ["service_url"]; q.returnGeometry = false;
      try {
        const res = await indexLayer.queryFeatures(q);
        if (!res.features.length) return;
        const serviceUrl = res.features[0].attributes.service_url;
        if (!serviceUrl) return;
        if (currentOverlayLayer) { map.remove(currentOverlayLayer); currentOverlayLayer = null; }
        currentOverlayLayer = serviceUrl.includes("{z}")
          ? new WebTileLayer({ urlTemplate: serviceUrl })
          : new TileLayer({ url: serviceUrl });
        map.add(currentOverlayLayer);
        map.reorder(currentOverlayLayer, 2); // above boundary, below feature layers
        currentOverlayLayer.opacity = document.getElementById("slider").value / 100;
        
      } catch(e) { console.error("[Sanborn]", e); }
    }

    function loadMapOverlay(feature) {
      if (currentOverlayLayer) { map.remove(currentOverlayLayer); currentOverlayLayer = null; }
      const serviceUrl = feature.attributes.service_url;
      if (!serviceUrl) return;
      currentOverlayLayer = serviceUrl.includes("{z}")
        ? new WebTileLayer({ urlTemplate: serviceUrl })
        : new TileLayer({ url: serviceUrl });
      map.add(currentOverlayLayer);
      map.reorder(currentOverlayLayer, 2); // above boundary, below feature layers
      currentOverlayLayer.opacity = document.getElementById("slider").value / 100;
      
    }

    // --- Shared feature handler (called from both desktop watch and mobile click) ---
    async function handleFeatureClick(graphic) {
      if (!graphic?.layer) return;

      if (graphic.layer.id === "fp") {
        const imgId   = graphic.attributes.img_id;
        const mapcode = graphic.attributes.mapyear;
        const attrs   = graphic.attributes;
        vsLayer.definitionExpression   = `img_id = '${imgId}'`;
        bldgLayer.definitionExpression = `img_id = '${imgId}'`;
        view.goTo({ center: graphic.geometry, zoom: 16 }, { duration: 600 });
        clearBldgHighlight();
        loadSanbornForMapcode(mapcode);
        if (isMobile()) {
          await openMobilePhotoViewer(imgId, attrs);
        } else {
          openViewerDrawer(imgId, attrs);
        }
      }

      if (graphic.layer.id === "bldg") {
        const imgCoords = graphic.attributes.img_coords;
        if (!imgCoords) return;
        const imgId = graphic.attributes.img_id;
        // Fetch metadata from vsLayer for the matching img_id
        const metaQ = vsLayer.createQuery();
        metaQ.where = `img_id = '${imgId}'`;
        metaQ.outFields = ["Title","Year","Description","Source","img_id"];
        metaQ.returnGeometry = false;
        const metaRes = await vsLayer.queryFeatures(metaQ);
        const attrs = metaRes.features.length ? metaRes.features[0].attributes : graphic.attributes;

        if (isMobile()) {
          const photoOpen = !photoModal.classList.contains("modal-dismissed");
          if (!photoOpen) {
            vsLayer.definitionExpression   = `img_id = '${imgId}'`;
            bldgLayer.definitionExpression = `img_id = '${imgId}'`;
            await openMobilePhotoViewer(imgId, attrs);
            getMobileOsd().addOnceHandler("open", () => highlightBldgInOSD(imgCoords, getMobileOsd()));
          } else {
            highlightBldgInOSD(imgCoords, getMobileOsd());
          }
        } else {
          const isOpen = document.getElementById("viewerDrawer").classList.contains("open");
          if (!isOpen) {
            vsLayer.definitionExpression   = `img_id = '${imgId}'`;
            bldgLayer.definitionExpression = `img_id = '${imgId}'`;
            await openViewerDrawer(imgId, attrs);
            osdViewer.addOnceHandler("open", () => highlightBldgInOSD(imgCoords));
          } else {
            highlightBldgInOSD(imgCoords);
          }
        }
      }

      if (graphic.layer.id === "mines") {
        openMineDrawer(graphic.attributes.site_name, graphic.attributes.url, graphic.attributes.dep_id);
      }
    }

    // --- Desktop: use selectedFeature watch (popup is enabled) ---
    if (!isMobile()) {
      reactiveUtils.watch(
        () => view.popup.selectedFeature,
        async (graphic) => { await handleFeatureClick(graphic); }
      );
    }

    // --- Mobile: use view click + hitTest (popup is disabled) ---
    if (isMobile()) {
      view.on("click", async (event) => {
        const response = await view.hitTest(event, {
          include: [fpLayer, bldgLayer, minesLayer]
        });
        if (!response.results.length) return;
        const graphic = response.results[0].graphic;
        await handleFeatureClick(graphic);
      });
    }

    // --- ViewerJS (legacy) ---
    const viewer = new Viewer(document.getElementById("image"), { navbar: false, toolbar: true });
    document.addEventListener("click", (e) => {
      if (e.target.closest(".esri-popup__content img")) {
        const feature = view.popup.selectedFeature;
        if (!feature) return;
        document.getElementById("image").src =
          "https://portal1-geo.sabu.mtu.edu/images/historic_images/" + feature.attributes.filename + ".jpg";
        document.getElementById("image").alt = feature.attributes.title;
        viewer.update(); viewer.show();
      }
    });

    // --- Desktop event bindings ---
    document.getElementById("searchBar").addEventListener("ionInput", filterItems);

    document.querySelectorAll("#mainTabBar ion-tab-button").forEach(btn => {
      btn.addEventListener("click", async () => {
        activeSegment = btn.getAttribute("tab");
        document.querySelectorAll("#mainTabBar ion-tab-button").forEach(b => b.removeAttribute("selected"));
        btn.setAttribute("selected", "true");
        await populateResults(document.getElementById("searchBar").value || "");
      });
    });

    // Refresh on map pan/zoom stop
    view.watch("stationary", isStationary => { if (isStationary) filterItems(); });

    // --- Initial load ---
    await view.when();
    await indexLayer.when();
    filterItems();

  })());
</script>
</body>
</html>
