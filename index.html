
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>UP Iron Atlas Beta</title>

  <!-- Ionic Framework -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"/>

  <!-- ViewerJS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.10.0/viewer.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.10.0/viewer.js"></script>

  <!-- OpenSeadragon -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>

  <!-- ArcGIS -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.23/esri/themes/dark/main.css" />
  <script src="https://js.arcgis.com/4.23/"></script>

  <style>
    html, body, ion-app, ion-content, ion-split-pane, ion-menu, #viewDiv {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    ion-toolbar {
      --background: #285756;
      --color: white;
    }

    #filters {
      padding: 10px;
    }

    #viewDiv {
      height: 100%;
      width: 100%;
    }

    #image {
      display: none;
    }

    .esri-popup__content img {
      cursor: pointer;
    }

    ion-tab-bar {
      --background: var(--ion-color-step-50, #f2f2f2);
    }

    /* Pulsing dot overlay for building highlights in OSD */
    .pulsing-dot {
      width: 20px;
      height: 20px;
      background-color: rgb(255, 0, 0);
      border-radius: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .pulsing-dot::before,
    .pulsing-dot::after {
      content: "";
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      z-index: -1;
      animation: pulse-grow 1.3s ease-in-out infinite;
    }
    .pulsing-dot::before {
      background: rgba(255, 0, 0, 0.6);
      animation-delay: -0.5s;
    }
    .pulsing-dot::after {
      background: rgba(255, 0, 0, 0.3);
    }
    @keyframes pulse-grow {
      0%   { transform: scale(1);   opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* Right drawer */
    #viewerDrawer {
      --width: 30%;
      --min-width: 280px;
    }

    /* Hide backdrop for right drawer so map stays interactive */
    ion-backdrop {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    #osd-container {
      width: 100%;
      height: calc(100% - 100px);
      background: #111;
    }

    #osd-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #888;
      font-size: 14px;
      gap: 12px;
    }

    #osd-placeholder ion-icon {
      font-size: 48px;
      color: #444;
    }

    #viewer-meta {
      padding: 8px 12px;
      background: #1a1a1a;
      color: #ccc;
      font-size: 12px;
      border-top: 1px solid #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Mine metadata panel */
    #mine-panel {
      font-size: 13px;
      line-height: 1.5;
    }
    #mine-panel h3 {
      font-size: 14px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 16px 0 6px;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }
    #mine-panel p {
      margin: 3px 0;
    }
    #mine-panel a {
      color: #4fc3f7;
    }
    #mine-panel table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 12px;
    }
    #mine-panel th {
      text-align: left;
      color: #aaa;
      padding: 3px 6px;
      border-bottom: 1px solid #333;
    }
    #mine-panel td {
      padding: 3px 6px;
      border-bottom: 1px solid #222;
    }
  </style>
</head>

<body>
<ion-app>
  <ion-menu-controller></ion-menu-controller>
  <script type="module">
    import { menuController } from "https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/index.esm.js";
    window.ionicMenuController = menuController;
  </script>
  <ion-header>
    <ion-toolbar>
      <ion-title>
        <img src="dmilogo.png" width="60" height="60" style="vertical-align: middle;">
        &nbsp; UP Iron Atlas beta
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-split-pane content-id="main">

      <!-- Left Sidebar (Filters) -->
      <ion-menu content-id="main" side="start" type="overlay" swipe-gesture="false">
        <ion-header>
          <ion-toolbar color="dark">
            <ion-title>Filters</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content id="filters">

          <!-- Search -->
          <ion-searchbar id="searchBar" placeholder="Search people, places, and photos"></ion-searchbar>

          <!-- Hidden image for ViewerJS -->
          <img id="image" src="" alt="Picture">

          <!-- Opacity Slider -->
          <ion-item>
            <ion-label>Overlay Opacity</ion-label>
          </ion-item>
          <ion-item>
            <ion-range id="slider" min="0" max="100" value="100" pin="true" mode="ios"></ion-range>
          </ion-item>

          <!-- Tab Bar -->
          <ion-tab-bar id="mainTabBar" selected-tab="maps">
            <ion-tab-button tab="maps">
              <ion-icon name="map"></ion-icon>
              <ion-label>Maps</ion-label>
              <ion-badge id="badge-maps" color="danger">0</ion-badge>
            </ion-tab-button>
            <ion-tab-button tab="places">
              <ion-icon name="business"></ion-icon>
              <ion-label>Places</ion-label>
              <ion-badge id="badge-places" color="danger">0</ion-badge>
            </ion-tab-button>
            <ion-tab-button tab="photos">
              <ion-icon name="camera"></ion-icon>
              <ion-label>Photos</ion-label>
              <ion-badge id="badge-photos" color="danger">0</ion-badge>
            </ion-tab-button>
            <ion-tab-button tab="people">
              <ion-icon name="people"></ion-icon>
              <ion-label>People</ion-label>
              <ion-badge id="badge-people" color="danger">0</ion-badge>
            </ion-tab-button>
          </ion-tab-bar>

          <!-- Results -->
          <ion-list id="resultsDiv">
            <ion-item>
              <ion-label id="result-block">Results</ion-label>
            </ion-item>
            <ion-list id="result-list"></ion-list>
          </ion-list>

        </ion-content>
      </ion-menu>

      <!-- Map Content -->
      <div class="ion-page" id="main">
        <div id="viewDiv"></div>
      </div>

    </ion-split-pane>

    <!-- Right Drawer — outside ion-split-pane so Ionic menu API works reliably -->
    <ion-menu side="end" type="overlay" swipe-gesture="false" backdrop-breakpoint="1"
              menu-id="viewer-menu" id="viewerDrawer" content-id="main">
      <ion-header>
        <ion-toolbar color="dark">
          <ion-title id="viewer-title">Photo Viewer</ion-title>
          <ion-buttons slot="end">
            <ion-button id="closeViewerBtn">
              <ion-icon slot="icon-only" name="close"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <!-- Photo / OSD mode -->
        <div id="osd-container">
          <div id="osd-placeholder">
            <ion-icon name="camera-outline"></ion-icon>
            <span>Select a photo point on the map</span>
          </div>
        </div>
        <div id="viewer-meta"></div>

        <!-- Mine metadata mode -->
        <div id="mine-panel" style="display:none; padding: 12px; color: var(--ion-text-color);">
          <div id="mine-loading" style="text-align:center; padding: 40px; color: #888;">
            <ion-spinner name="crescent"></ion-spinner>
            <p>Loading mine data...</p>
          </div>
          <div id="mine-content" style="display:none;"></div>
        </div>
      </ion-content>
    </ion-menu>

  </ion-content>
</ion-app>

<script>
  require([
    "esri/Map",
    "esri/views/MapView",
    "esri/layers/FeatureLayer",
    "esri/layers/GraphicsLayer",
    "esri/Graphic",
    "esri/layers/TileLayer",
    "esri/layers/WebTileLayer",
    "esri/widgets/Home",
    "esri/core/reactiveUtils"
  ], (Map, MapView, FeatureLayer, GraphicsLayer, Graphic, TileLayer, WebTileLayer, Home, reactiveUtils) => (async () => {

    const invisibleRenderer = {
      type: "simple",
      symbol: {
        type: "simple-fill",
        color: [255, 128, 0, 0],
        outline: { width: 1, color: "black" }
      }
    };

    const fpRenderer = {
      type: "simple",
      symbol: {
        type: "picture-marker",
        url: "marker_picture_black.svg",
        width: "25px",
        height: "25px"
      }
    };

    // --- Layers ---

    const indexLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/UP_Iron_Atlas_Index_Map/FeatureServer/0",
      outFields: ["*"],
      renderer: invisibleRenderer,
      maxScale: 24,
      minScale: 0
    });

    const poiLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/Iron_Atlas_POIs/FeatureServer/0",
      outFields: ["*"],
      renderer: invisibleRenderer,
      maxScale: 24,
      minScale: 0
    });

    const vsLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/Iron_Range_Viewsheds/FeatureServer/0",
      outFields: ["*"],
      renderer: invisibleRenderer,
      maxScale: 24,
      minScale: 0
    });

    const fpLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/VS_FOCAL_DEMO/FeatureServer/0",
      outFields: ["*"],
      renderer: fpRenderer,
      maxScale: 24,
      minScale: 0,
      id: "fp"
    });

    const cdLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/Iron_Range_City_Directory_Data/FeatureServer/0",
      outFields: ["*"],
      renderer: invisibleRenderer,
      maxScale: 24,
      minScale: 0
    });

    const bldgLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/IronRangeBuildingFootprints/FeatureServer/0",
      outFields: ["*"],
      maxScale: 24,
      minScale: 0,
      id: "bldg"
    });

    const minesLayer = new FeatureLayer({
      url: "https://services2.arcgis.com/RPhrOu9XQzI31xTa/arcgis/rest/services/IronRangeMinesLocations/FeatureServer/0",
      outFields: ["site_name", "url", "dep_id"],
      renderer: {
        type: "simple",
        symbol: {
          type: "simple-marker",
          color: [180, 60, 20],
          size: 10,
          outline: { color: [255, 255, 255], width: 1 }
        }
      },
      id: "mines"
    });

    minesLayer.popupTemplate = {
      title: "{site_name}",
      content: [{ type: "text", text: `<a href="{url}" target="_blank">{url}</a>` }]
    };

    const markerLayer = new GraphicsLayer({ id: "markers" });

    // --- Map & View ---
    // Layer order bottom→top: indexLayer, [Sanborn overlay at pos 1], markerLayer, fpLayer, vsLayer, bldgLayer, minesLayer

    const map = new Map({
      basemap: "satellite",
      layers: [indexLayer, markerLayer, fpLayer, vsLayer, bldgLayer, minesLayer]
    });

    const view = new MapView({
      container: "viewDiv",
      map,
      center: [-88.5694, 47.1211],
      zoom: 7,
      highlightOptions: {
        color: [255, 204, 0],
        haloOpacity: 1,
        fillOpacity: 0
      }
    });

    view.popup = {
      dockEnabled: true,
      dockOptions: { buttonEnabled: false, breakpoint: false }
    };

    view.ui.add(new Home({ view }), "top-left");
    view.ui.move("zoom", "top-left");

    fpLayer.popupTemplate  = { title: "photopoint", content: "Description" };
    bldgLayer.popupTemplate = { title: "photopoint", content: "Description" };

    vsLayer.definitionExpression  = "img_id = '0000000000000000000000000000'";
    bldgLayer.definitionExpression = "img_id = '0000000000000000000000000000'";

    const indexLayerView = await view.whenLayerView(indexLayer);

    let currentOverlayLayer = null;
    let activeSegment = "maps";

    // --- OSD Setup ---

    const IIIF_BASE = "https://cchi-iif.mtu.edu/iiif/3";

    const osdViewer = OpenSeadragon({
      id: "osd-container",
      prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
      showNavigationControl: true,
      showNavigator: true,
      navigatorPosition: "BOTTOM_RIGHT",
      animationTime: 0.5,
      immediateRender: false,
      wrapHorizontal: false,
    });

    function openIIIFImage(imgId) {
      const placeholder = document.getElementById("osd-placeholder");
      if (placeholder) placeholder.style.display = "none";
      const manifestUrl = `${IIIF_BASE}/${imgId}/info.json`;
      osdViewer.open(manifestUrl);
      document.getElementById("viewer-title").innerText = imgId.replace(/\.[^/.]+$/, "");
      document.getElementById("viewer-meta").innerText = manifestUrl;
    }

    async function openViewerDrawer(imgId) {
      setDrawerMode("photo");
      await openDrawer();
      setTimeout(() => openIIIFImage(imgId), 300);
    }

    // --- Building footprint → OSD pulsing dot ---

    const BLDG_DOT_ID = "bldg-highlight-dot";

    function clearBldgHighlight() {
      osdViewer.removeOverlay(BLDG_DOT_ID);
    }

    function highlightBldgInOSD(imgCoords) {
      clearBldgHighlight();
      const parts = imgCoords.split(",");
      if (parts.length < 2) return;
      const imageX = parseFloat(parts[0]);
      const imageY = parseFloat(parts[1]);
      if (isNaN(imageX) || isNaN(imageY)) return;
      const tiledImage = osdViewer.world.getItemAt(0);
      if (!tiledImage) return;
      const viewportPoint = tiledImage.imageToViewportCoordinates(
        new OpenSeadragon.Point(imageX, imageY)
      );
      const dot = document.createElement("div");
      dot.className = "pulsing-dot";
      dot.id = BLDG_DOT_ID;
      osdViewer.addOverlay({ element: dot, location: viewportPoint });
      const delta = 0.15;
      const bounds = new OpenSeadragon.Rect(
        viewportPoint.x - delta, viewportPoint.y - delta, delta * 2, delta * 2
      );
      osdViewer.viewport.fitBounds(bounds, false);
    }

    // --- Drawer controls ---

    function setDrawerMode(mode) {
      document.getElementById("osd-container").style.display = mode === "photo" ? "block" : "none";
      document.getElementById("viewer-meta").style.display   = mode === "photo" ? "block" : "none";
      document.getElementById("mine-panel").style.display    = mode === "mine"  ? "block" : "none";
    }

    async function openDrawer() {
      await window.ionicMenuController.open("viewer-menu");
    }

    async function closeDrawer() {
      await window.ionicMenuController.close("viewer-menu");
    }

    // Prevent backdrop tap from closing the drawer — only X button should close it
    document.getElementById("viewerDrawer").addEventListener("ionBackdropTap", (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    // Disable backdrop dismiss on the menu element directly
    const viewerDrawerEl = document.getElementById("viewerDrawer");
    viewerDrawerEl.componentOnReady().then(() => {
      viewerDrawerEl.backdropDismiss = false;
    });

    document.getElementById("closeViewerBtn").addEventListener("click", closeDrawer);

    // --- Mine metadata panel ---

    const USGS_BASE = "https://mrdata.usgs.gov/mrds/json";

    function formatMinePanel(siteName, siteUrl, data) {
      const p = data.properties;
      const dep = p.deposits || {};
      const loc = p.location || {};
      const geo = p.geo_coordinates || {};
      const owners    = Array.isArray(p.ownership)        ? p.ownership        : [];
      const materials = Array.isArray(p.material)         ? p.material         : [];
      const production = Array.isArray(p.production)      ? p.production       : [];
      const plss      = Array.isArray(p.plss_coordinates) ? p.plss_coordinates : [];
      const commodity = p.commodity || {};

      const ownerRows = owners.map(o =>
        `<tr><td>${o.owner_name ?? ""}</td><td>${o.owner_tp ?? ""}</td><td>${o.beg_yr ?? ""}${o.end_yr ? "–" + o.end_yr : ""}</td></tr>`
      ).join("");

      const matRows = materials.map(m =>
        `<tr><td>${m.material ?? ""}</td><td>${m.ore_gangue ?? ""}</td></tr>`
      ).join("");

      const prodRows = production
        .filter(r => r.yr)
        .sort((a, b) => a.yr - b.yr)
        .map(r => `<tr><td>${r.yr}</td><td>${Number(r.mined).toLocaleString()} ${r.units ?? ""}</td><td>${r.item ?? ""}</td></tr>`)
        .join("");

      const plssText = plss.map(p =>
        `T${p.township ?? ""} R${p.range ?? ""}, Sec ${p.section ?? ""} ${p.sect_fract ?? ""}`
      ).join("<br>");

      return `
        <h3>Site</h3>
        <p><strong>${siteName}</strong></p>
        ${siteUrl ? `<p><a href="${siteUrl}" target="_blank">Full record ↗</a></p>` : ""}
        <p>${dep.dev_st ?? ""} &bull; ${dep.dep_tp ?? ""} &bull; ${dep.oper_tp ?? ""}</p>

        <h3>Location</h3>
        <p>${loc.county ?? ""} County, ${loc.state_prov ?? ""}</p>
        <p>${geo.rel_pos ?? ""}</p>
        ${plssText ? `<p>${plssText}</p>` : ""}

        <h3>Years of Operation</h3>
        <p>${dep.yr_fst_prd ?? "?"} – ${dep.yr_lst_prd ?? "?"}</p>
        ${dep.prod_yrs ? `<p style="color:#aaa; font-size:12px;">${dep.prod_yrs}</p>` : ""}

        <h3>Commodity</h3>
        <p>${commodity.commod ?? ""} (${commodity.commod_tp ?? ""}) &bull; ${commodity.import ?? ""}</p>

        <h3>Materials</h3>
        <table>
          <tr><th>Material</th><th>Type</th></tr>
          ${matRows || "<tr><td colspan='2'>None recorded</td></tr>"}
        </table>

        <h3>Ownership</h3>
        <table>
          <tr><th>Owner/Operator</th><th>Role</th><th>Years</th></tr>
          ${ownerRows || "<tr><td colspan='3'>None recorded</td></tr>"}
        </table>

        <h3>Production by Year</h3>
        <table>
          <tr><th>Year</th><th>Amount</th><th>Commodity</th></tr>
          ${prodRows || "<tr><td colspan='3'>None recorded</td></tr>"}
        </table>
      `;
    }

    async function openMineDrawer(siteName, siteUrl, depId) {
      setDrawerMode("mine");
      document.getElementById("viewer-title").innerText = siteName ?? "Mine Details";
      document.getElementById("mine-loading").style.display = "block";
      document.getElementById("mine-content").style.display = "none";
      await openDrawer();
      try {
        const resp = await fetch(`${USGS_BASE}/${depId}`);
        const data = await resp.json();
        document.getElementById("mine-content").innerHTML = formatMinePanel(siteName, siteUrl, data);
        document.getElementById("mine-loading").style.display = "none";
        document.getElementById("mine-content").style.display = "block";
      } catch (e) {
        document.getElementById("mine-loading").innerHTML =
          `<p style="color:#f66;">Failed to load USGS data.</p>
           ${siteUrl ? `<p><a href="${siteUrl}" target="_blank">View full record ↗</a></p>` : ""}`;
      }
    }

    // --- Segment config ---

    const segmentConfig = {
      maps: {
        layer: indexLayer,
        layerView: null,
        titleField: "title",
        subtitleField: "mapyear",
        searchFields: (val) =>
          `(Upper(title) LIKE '%${val.toUpperCase()}%' OR Upper(tags) LIKE '%${val.toUpperCase()}%' OR datapub LIKE '%${val}%')`
      },
      places: {
        layer: poiLayer,
        layerView: null,
        titleField: "Name",
        subtitleField: "Address",
        searchFields: (val) =>
          `(Upper(name) LIKE '%${val.toUpperCase()}%' OR Upper(Address) LIKE '%${val.toUpperCase()}%')`
      },
      photos: {
        layer: vsLayer,
        layerView: null,
        titleField: "img_id",
        subtitleField: "mapyear",
        searchFields: (val) =>
          `(Upper(img_id) LIKE '%${val.toUpperCase()}%')`
      },
      people: {
        layer: cdLayer,
        layerView: null,
        titleField: "Name",
        subtitleField: "Occupation",
        searchFields: (val) =>
          `(Upper(fullname) LIKE '%${val.toUpperCase()}%' OR Upper(occupation) LIKE '%${val.toUpperCase()}%' OR Upper(address) LIKE '%${val.toUpperCase()}%')`
      }
    };

    segmentConfig.maps.layerView = indexLayerView;
    map.addMany([poiLayer, cdLayer]);

    const [poiLV, vsLV, cdLV] = await Promise.all([
      view.whenLayerView(poiLayer),
      view.whenLayerView(vsLayer),
      view.whenLayerView(cdLayer)
    ]);
    segmentConfig.places.layerView = poiLV;
    segmentConfig.photos.layerView = vsLV;
    segmentConfig.people.layerView = cdLV;

    // --- Query helpers ---

    function buildWhereClause(cfg, searchVal) {
      if (searchVal && searchVal.trim()) return cfg.searchFields(searchVal.trim());
      return "1=1";
    }

    async function queryLayerInExtent(cfg, searchVal) {
      const query = cfg.layer.createQuery();
      query.returnGeometry = true;
      query.geometry = view.extent;
      query.where = buildWhereClause(cfg, searchVal);
      const results = await cfg.layer.queryFeatures(query);
      return results.features;
    }

    // --- Sort helpers ---

    function sortFeatures(features, segment) {
      if (segment === "maps") {
        // Primary: title A-Z, secondary: mapyear descending (latest first)
        return [...features].sort((a, b) => {
          const titleA = (a.attributes.title ?? "").toUpperCase();
          const titleB = (b.attributes.title ?? "").toUpperCase();
          if (titleA < titleB) return -1;
          if (titleA > titleB) return 1;
          // Same title — sort by year descending
          const yearA = parseInt(a.attributes.mapyear) || 0;
          const yearB = parseInt(b.attributes.mapyear) || 0;
          return yearB - yearA;
        });
      }
      return features; // other tabs unsorted for now
    }

    // --- Badges ---

    async function updateAllBadges(searchVal) {
      const tabs = ["maps", "places", "photos", "people"];
      await Promise.all(tabs.map(async (tab) => {
        const cfg = segmentConfig[tab];
        try {
          const query = cfg.layer.createQuery();
          query.geometry = view.extent;
          query.where = buildWhereClause(cfg, searchVal);
          const count = await cfg.layer.queryFeatureCount(query);
          const badge = document.getElementById(`badge-${tab}`);
          if (badge) badge.innerText = count;
        } catch (e) { /* leave badge as-is */ }
      }));
    }

    // --- Results list ---

    async function populateResults(searchVal) {
      const cfg = segmentConfig[activeSegment];
      const resultList  = document.getElementById("result-list");
      const resultBlock = document.getElementById("result-block");

      resultList.innerHTML = "";
      resultBlock.innerText = "Results";

      let features = [];
      try {
        features = await queryLayerInExtent(cfg, searchVal);
      } catch (e) {
        resultBlock.innerText = "Results (unavailable)";
        return;
      }

      // Sort before rendering
      features = sortFeatures(features, activeSegment);

      resultBlock.innerText = `Results (${features.length})`;

      if (cfg.layerView) {
        const objectIds = features.map(f => f.attributes[cfg.layer.objectIdField] ?? f.attributes.OBJECTID);
        cfg.layerView.filter = { objectIds };
      }

      features.forEach((feature) => {
        const title    = feature.attributes[cfg.titleField]    ?? "(no title)";
        const subtitle = feature.attributes[cfg.subtitleField] ?? "";

        const item = document.createElement("ion-item");

        if (activeSegment === "people") {
          const address = feature.attributes.Address ?? "";
          const dirYear = feature.attributes.dirYear ?? "";
          item.innerHTML = `<ion-label>
            <h2>${title}</h2>
            <p>${subtitle}</p>
            <p>${address}</p>
            <p>${dirYear}</p>
          </ion-label>`;
        } else {
          item.innerHTML = `<ion-label>
            <h2>${title}</h2>
            <p>${subtitle}</p>
          </ion-label>`;
        }

        item.addEventListener("click", async () => {
          if (activeSegment === "maps") {
            loadMapOverlay(feature);
          } else if (activeSegment === "photos") {
            const imgId   = feature.attributes.img_id;
            const mapcode = feature.attributes.mapyear;
            vsLayer.definitionExpression   = `img_id = '${imgId}'`;
            bldgLayer.definitionExpression = `img_id = '${imgId}'`;
            loadSanbornForMapcode(mapcode);
            clearBldgHighlight();
            const fpQuery = fpLayer.createQuery();
            fpQuery.where = `img_id = '${imgId}'`;
            fpQuery.returnGeometry = true;
            fpQuery.outFields = ["*"];
            const fpResult = await fpLayer.queryFeatures(fpQuery);
            if (fpResult.features.length) {
              const fpFeature = fpResult.features[0];
              const fpLV = await view.whenLayerView(fpLayer);
              fpLV.highlight(fpFeature);
              view.goTo({ center: fpFeature.geometry, zoom: 16 }, { duration: 600 });
            } else {
              view.goTo({ center: feature.geometry.centroid ?? feature.geometry }, { duration: 400 });
            }
            openViewerDrawer(imgId);
          } else if (activeSegment === "places" || activeSegment === "people") {
            const geom = feature.geometry.type === "polygon"
              ? feature.geometry.centroid
              : feature.geometry;
            loadSanbornForMapcode(feature.attributes.mapyear);
            markerLayer.removeAll();
            markerLayer.add(new Graphic({
              geometry: geom,
              symbol: {
                type: "simple-marker",
                color: [255, 204, 0],
                size: 12,
                outline: { color: [0, 0, 0], width: 1.5 }
              }
            }));
            view.goTo({ center: geom, zoom: 17 }, { duration: 400 });
          }
        });

        resultList.appendChild(item);
      });
    }

    // --- Full refresh ---

    async function filterItems() {
      const searchVal = document.getElementById("searchBar").value || "";
      await Promise.all([updateAllBadges(searchVal), populateResults(searchVal)]);
    }

    // --- Load Sanborn overlay by mapcode ---

    async function loadSanbornForMapcode(mapcode) {
      console.log("[Sanborn] loadSanbornForMapcode called with:", mapcode);
      if (!mapcode) { console.warn("[Sanborn] No mapcode provided — aborting"); return; }

      const query = indexLayer.createQuery();
      query.where = `mapcode = '${mapcode}'`;
      query.outFields = ["service_url", "mapcode"];
      query.returnGeometry = false;

      try {
        const results = await indexLayer.queryFeatures(query);
        console.log("[Sanborn] Query returned", results.features.length, "features");
        if (!results.features.length) { console.warn("[Sanborn] No match for mapcode:", mapcode); return; }

        const serviceUrl = results.features[0].attributes.service_url;
        if (!serviceUrl) { console.warn("[Sanborn] service_url empty"); return; }

        if (currentOverlayLayer) { map.remove(currentOverlayLayer); currentOverlayLayer = null; }

        currentOverlayLayer = serviceUrl.includes("{z}")
          ? new WebTileLayer({ urlTemplate: serviceUrl })
          : new TileLayer({ url: serviceUrl });

        map.add(currentOverlayLayer);
        map.reorder(currentOverlayLayer, 1);
        currentOverlayLayer.opacity = document.getElementById("slider").value / 100;
        console.log("[Sanborn] Layer added at position 1");
      } catch (e) {
        console.error("[Sanborn] Error:", e);
      }
    }

    // --- Map overlay (Maps tab) ---

    function loadMapOverlay(feature) {
      if (currentOverlayLayer) { map.remove(currentOverlayLayer); currentOverlayLayer = null; }
      const serviceUrl = feature.attributes.service_url;
      if (!serviceUrl) return;
      currentOverlayLayer = serviceUrl.includes("{z}")
        ? new WebTileLayer({ urlTemplate: serviceUrl })
        : new TileLayer({ url: serviceUrl });
      map.add(currentOverlayLayer);
      map.reorder(currentOverlayLayer, 1);
      currentOverlayLayer.opacity = document.getElementById("slider").value / 100;
    }

    // --- Popup watch ---

    reactiveUtils.watch(
      () => view.popup.selectedFeature,
      async (graphic) => {
        if (!graphic || !graphic.layer) return;

        if (graphic.layer.id === "fp") {
          const imgId   = graphic.attributes.img_id;
          const mapcode = graphic.attributes.mapyear;
          console.log("[fp click] img_id:", imgId, "| mapyear:", mapcode);
          vsLayer.definitionExpression   = `img_id = '${imgId}'`;
          bldgLayer.definitionExpression = `img_id = '${imgId}'`;
          view.goTo({ center: graphic.geometry, zoom: 16 }, { duration: 600 });
          clearBldgHighlight();
          loadSanbornForMapcode(mapcode);
          openViewerDrawer(imgId);
        }

        if (graphic.layer.id === "bldg") {
          const imgCoords = graphic.attributes.img_coords;
          if (!imgCoords) return;
          const imgId  = graphic.attributes.img_id;
          const isOpen = await window.ionicMenuController.isOpen("viewer-menu");
          if (!isOpen) {
            vsLayer.definitionExpression   = `img_id = '${imgId}'`;
            bldgLayer.definitionExpression = `img_id = '${imgId}'`;
            await openViewerDrawer(imgId);
            osdViewer.addOnceHandler("open", () => highlightBldgInOSD(imgCoords));
          } else {
            highlightBldgInOSD(imgCoords);
          }
        }

        if (graphic.layer.id === "mines") {
          openMineDrawer(
            graphic.attributes.site_name,
            graphic.attributes.url,
            graphic.attributes.dep_id
          );
        }
      }
    );

    // --- ViewerJS (legacy) ---

    const viewer = new Viewer(document.getElementById("image"), { navbar: false, toolbar: true });

    function updateViewer() {
      const feature = view.popup.selectedFeature;
      if (!feature) return;
      document.getElementById("image").src =
        "https://portal1-geo.sabu.mtu.edu/images/historic_images/" +
        feature.attributes.filename + ".jpg";
      document.getElementById("image").alt = feature.attributes.title;
      viewer.update();
    }

    document.addEventListener("click", (e) => {
      if (e.target.closest(".esri-popup__content img")) { updateViewer(); viewer.show(); }
    });

    // --- Event bindings ---

    document.getElementById("searchBar").addEventListener("ionInput", filterItems);

    document.getElementById("slider").addEventListener("ionInput", (ev) => {
      if (currentOverlayLayer) currentOverlayLayer.opacity = ev.target.value / 100;
    });

    document.querySelectorAll("#mainTabBar ion-tab-button").forEach((btn) => {
      btn.addEventListener("click", async () => {
        activeSegment = btn.getAttribute("tab");
        document.querySelectorAll("#mainTabBar ion-tab-button").forEach(b => b.removeAttribute("selected"));
        btn.setAttribute("selected", "true");
        const searchVal = document.getElementById("searchBar").value || "";
        await populateResults(searchVal);
      });
    });

    view.watch("stationary", (isStationary) => { if (isStationary) filterItems(); });

    // --- Initial load ---

    await view.when();
    await indexLayer.when();
    filterItems();

  })());
</script>
</body>
</html>
